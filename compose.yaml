name: quetzal

services:
  quetzal:
    build: .
    image: quetzal:local
    restart: unless-stopped
    # Preserve observed peer addresses for registration and native NAT traversal.
    network_mode: host
    user: "${QUETZAL_UID:-1000}:${QUETZAL_GID:-1000}"
    environment:
      QUETZAL_BIND: ${QUETZAL_BIND:-127.0.0.1}
      QUETZAL_PUBLIC_IP: ${QUETZAL_PUBLIC_IP:-${QUETZAL_BIND:-127.0.0.1}}
      QUETZAL_GAMES: ${QUETZAL_GAMES:-25tolife}
      QUETZAL_HTTP_PORT: ${QUETZAL_HTTP_PORT:-8082}
      QUETZAL_STATE_DIR: /data/state
      QUETZAL_CAPTURE_DIR: ${QUETZAL_CAPTURE_DIR:-}
      QUETZAL_LOG_LEVEL: ${QUETZAL_LOG_LEVEL:-info}
      QUETZAL_TTL_MOTD_FILE: ${QUETZAL_TTL_MOTD_FILE:-}
      QUETZAL_RELAY_MODE: ${QUETZAL_RELAY_MODE:-adaptive}
      QUETZAL_RELAY_FIRST_PORT: ${QUETZAL_RELAY_FIRST_PORT:-30200}
      QUETZAL_RELAY_LAST_PORT: ${QUETZAL_RELAY_LAST_PORT:-30327}
      QUETZAL_COMMANDOS_BIND: ${QUETZAL_COMMANDOS_BIND:-}
      QUETZAL_COMMANDOS_PUBLIC_IP: ${QUETZAL_COMMANDOS_PUBLIC_IP:-}
      QUETZAL_COMMANDOS_AUTH_PORT: ${QUETZAL_COMMANDOS_AUTH_PORT:-}
      QUETZAL_COMMANDOS_SECURE_PORT: ${QUETZAL_COMMANDOS_SECURE_PORT:-}
      QUETZAL_COMMANDOS_PAYLOAD_MODE: ${QUETZAL_COMMANDOS_PAYLOAD_MODE:-plain}
      QUETZAL_COMMANDOS_RELAY_MODE: ${QUETZAL_COMMANDOS_RELAY_MODE:-adaptive}
      QUETZAL_COMMANDOS_RELAY_FIRST_PORT: ${QUETZAL_COMMANDOS_RELAY_FIRST_PORT:-30600}
      QUETZAL_COMMANDOS_RELAY_LAST_PORT: ${QUETZAL_COMMANDOS_RELAY_LAST_PORT:-30727}
      QUETZAL_TDU_BIND: ${QUETZAL_TDU_BIND:-}
      QUETZAL_TDU_PUBLIC_IP: ${QUETZAL_TDU_PUBLIC_IP:-}
      QUETZAL_TDU_AUTH_PORT: ${QUETZAL_TDU_AUTH_PORT:-}
      QUETZAL_TDU_SECURE_PORT: ${QUETZAL_TDU_SECURE_PORT:-}
      QUETZAL_TDU_MASTER_PORT: ${QUETZAL_TDU_MASTER_PORT:-}
      QUETZAL_TDU_PROXY_PORT: ${QUETZAL_TDU_PROXY_PORT:-}
      QUETZAL_TDU_DIRECTORY_PORT: ${QUETZAL_TDU_DIRECTORY_PORT:-}
      QUETZAL_TDU_RESOURCE_PORT: ${QUETZAL_TDU_RESOURCE_PORT:-}
      QUETZAL_TDU_SESSION_PORT: ${QUETZAL_TDU_SESSION_PORT:-}
      QUETZAL_TDU_DENSITY_PORT: ${QUETZAL_TDU_DENSITY_PORT:-}
      QUETZAL_TDU_USERMAP_PORT: ${QUETZAL_TDU_USERMAP_PORT:-}
      QUETZAL_TDU_ACTIVITY_CATALOG: ${QUETZAL_TDU_ACTIVITY_CATALOG:-}
      QUETZAL_TDU_NETCONFIG: ${QUETZAL_TDU_NETCONFIG:-}
      QUETZAL_TDU_PRIZE: ${QUETZAL_TDU_PRIZE:-}
    volumes:
      - ./data:/data:Z
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/quetzal", "-healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
